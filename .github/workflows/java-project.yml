name: work with java and maven from manikanta

on:
  push:
  workflow_dispatch:

jobs:
  job-java-maven-setup:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup Java JDK
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'microsoft'
      - run: mvn --debug-mode --update-shapshots verify
      - run: mkdir staging && cp target/*.jar staging
      
      
          
  




  
